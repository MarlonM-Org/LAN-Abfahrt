<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAN-Abfahrt – TV</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2d1b12; overflow: hidden;  }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; }
      #sound { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); padding: 1.2vh 2vh; font: 1.6vh 'Press Start 2P', monospace; color: #3d2414; background: #f7e4b5; border: 0.5vh solid #8d5629; box-shadow: 0 0 0 0.3vh #2d1b12; animation: pulse 1.2s infinite alternate; cursor: pointer; }
      @keyframes pulse { to { opacity: 0.6; } }
      /* Ausrichtungs-Ansage beim Start eines Minispiels (host/main.ts) – gleicher Stil wie #sound, aber oben */
      #orient-tv { position: fixed; left: 50%; top: 3vh; transform: translateX(-50%); z-index: 5; padding: 1.4vh 2.4vh; font: 2vh 'Press Start 2P', monospace; line-height: 1.6; white-space: nowrap; color: #3d2414; background: #f7e4b5; border: 0.5vh solid #8d5629; box-shadow: 0 0 0 0.3vh #2d1b12; pointer-events: none; transition: opacity 0.4s; }
      #orient-tv.landscape { background: #ffd25e; animation: pulse 0.6s infinite alternate; }
      #orient-tv.off { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="orient-tv" class="off"></div>
    <div id="sound">Klicken oder Taste drücken für Musik &amp; Sound &nbsp;·&nbsp; M = Musik-Menü</div>
    <script type="module" src="./host/main.ts"></script>
  </body>
</html>
