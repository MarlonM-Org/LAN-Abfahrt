<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAN-Abfahrt – TV</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2d1b12; overflow: hidden;  }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; }
      #sound { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); padding: 1.2vh 2vh; font: 1.6vh 'Press Start 2P', monospace; color: #3d2414; background: #f7e4b5; border: 0.5vh solid #8d5629; box-shadow: 0 0 0 0.3vh #2d1b12; animation: pulse 1.2s infinite alternate; cursor: pointer; }
      @keyframes pulse { to { opacity: 0.6; } }
      /* Ausrichtungs-Ansage beim Start eines Minispiels ohne Regelkarte (host/main.ts) – Stil wie #sound, knapp darüber (HUD oben bleibt frei) */
      #orient-tv { position: fixed; left: 50%; bottom: 10vh; transform: translateX(-50%); z-index: 5; padding: 1vh 1.8vh; font: 1.5vh 'Press Start 2P', monospace; line-height: 1.6; white-space: nowrap; color: #3d2414; background: #f7e4b5; border: 0.5vh solid #8d5629; box-shadow: 0 0 0 0.3vh #2d1b12; pointer-events: none; transition: opacity 0.4s; }
      #orient-tv.landscape { background: #ffd25e; animation: pulse 0.6s infinite alternate; }
      #orient-tv.off { opacity: 0; animation: none; }
      #orient-tv.now { transition: none; }
      /* Zuschauer-Overlay (host/emotes.ts): Emotes mit Porträt, Wett-Anzeige, Konfetti – unabhängig von der Phaser-Szene */
      #spec-layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; font-family: 'Press Start 2P', monospace; }
      .spec-emote { position: absolute; bottom: 1vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; animation: spec-rise 3.4s ease-out forwards; }
      .spec-emote span { font-size: 6vh; line-height: 1; filter: drop-shadow(0 0.4vh 0 rgba(45, 27, 18, 0.55)); }
      .spec-emote img { width: 4.2vh; height: auto; image-rendering: pixelated; margin-top: 0.4vh; background: #f7e4b5; border: 0.35vh solid #8d5629; border-radius: 0.6vh; box-shadow: 0 0 0 0.25vh #2d1b12; }
      @keyframes spec-rise {
        0% { transform: translate(-50%, 4vh) scale(0.4); opacity: 0; }
        12% { transform: translate(-50%, 0) scale(1.15); opacity: 1; }
        22% { transform: translate(-50%, -2vh) scale(1); }
        75% { opacity: 1; }
        100% { transform: translate(calc(-50% + var(--drift, 0vh)), -30vh) scale(0.9); opacity: 0; }
      }
      .spec-bets { position: absolute; right: 1.6vh; bottom: 1.6vh; display: flex; flex-direction: column; gap: 0.6vh; align-items: flex-end; transition: opacity 0.3s; }
      .spec-bets.off { opacity: 0; }
      .spec-bet { padding: 0.8vh 1.2vh; font-size: 1.4vh; color: #3d2414; background: #f7e4b5; border: 0.35vh solid #8d5629; box-shadow: 0 0 0 0.25vh #2d1b12; white-space: nowrap; }
      .spec-bet.won { background: #ffd25e; animation: pulse 0.5s infinite alternate; }
      .spec-bet.lost { opacity: 0.55; }
      .spec-win { position: absolute; left: 50%; top: 22vh; transform: translateX(-50%); padding: 1.4vh 2.4vh; font-size: 2.2vh; color: #3d2414; background: #ffd25e; border: 0.5vh solid #8d5629; box-shadow: 0 0 0 0.3vh #2d1b12; white-space: nowrap; animation: spec-pop 3.2s ease-out forwards; }
      @keyframes spec-pop { 0% { transform: translateX(-50%) scale(0.3); opacity: 0; } 10% { transform: translateX(-50%) scale(1.12); opacity: 1; } 18% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
      .spec-confetti { position: absolute; top: -3vh; width: 1vh; height: 1.6vh; animation: spec-fall 2.4s linear forwards; }
      @keyframes spec-fall { to { transform: translate(var(--sway, 0), 106vh) rotate(var(--spin, 360deg)); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="orient-tv" class="off"></div>
    <div id="spec-layer"></div>
    <div id="sound">Klicken oder Taste drücken für Musik &amp; Sound &nbsp;·&nbsp; M = Musik-Menü</div>
    <script type="module" src="./host/main.ts"></script>
  </body>
</html>
